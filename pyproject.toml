[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hitlawlart-alignrsr_jd469"
version = "0.1.0"
description = "按段落统计对齐算法研究员·长工具链的上下文回收相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "hitlawlart" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://hitlawlart.github.io"
Repository = "https://github.com/hitlawlart/alignrsr_jd469"
Issues = "https://github.com/hitlawlart/alignrsr_jd469/issues"

[project.scripts]
alignrsr_jd469 = "alignrsr_jd469:main"

[tool.setuptools]
py-modules = ["alignrsr_jd469"]
